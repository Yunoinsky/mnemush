# Mnemush configuration
# Copy to ~/.mnemush/config.toml and edit.
# Missing fields = use code defaults (see crates/mnemush/src/config.rs).

[forgetting]
# Base half-life in days (importance=0.5 → 90d, importance=1.0 → 135d)
half_life_days = 90.0
# How much importance modulates half-life (0=ignore, 1=±50%)
half_life_importance_weight = 0.5
# confidence below this → prune candidate
prune_confidence_threshold = 0.1
# confidence below this + days no access > prune_max_days_no_access → prune
prune_min_confidence_for_candidate = 0.3
prune_max_days_no_access = 30
# importance above this → exempt from pruning
prune_importance_exempt = 0.7
# access boost factor: confidence *= 1 + ln(access_count+1) * factor
access_boost_factor = 0.15
# initial confidence for new memories
initial_confidence_default = 1.0
# default importance for new memories
importance_default = 0.5
# true = never decay (archive mode)
disable_forgetting = false

[edges]
# auto-link strength for same topic_key
auto_link_topic_strength = 0.6
# text similarity in this range → trigger supersede detection
auto_link_supersede_min_sim = 0.5
auto_link_supersede_max_sim = 0.95
# Weak-similarity auto-link layer (added v0.2). On every memory_add, an
# FTS5 OR-query against recent content computes Jaccard similarity; pairs
# in `[weak_min, weak_max)` get a low-strength `related` edge (up to
# `weak_limit` per new memory). Covers the gap between "same topic" and
# "near-supersede" — surfaces related memories the explicit link missed.
auto_link_weak_min_sim = 0.05
auto_link_weak_max_sim = 0.5
auto_link_weak_strength = 0.4
auto_link_weak_limit = 3
# edge decay half-life (independent of nodes)
edge_decay_half_life_days = 60.0
# default max hops for neighbor queries
max_neighbor_hops = 2
# master switch for auto-linking on add
auto_link_enabled = true

[search]
default_limit = 10
# score = bm25 * relevance^w_r * recency^w_re * importance^w_i
weight_relevance = 1.0
weight_recency = 0.3
weight_importance = 0.2

[storage]
db_path = "~/.mnemush/mnemush.db"

# ── Environment variable overrides ──────────────────────────────────────
# Applied after TOML is loaded. See apply_env_overrides() in
# crates/mnemush/src/config.rs.
#
#   MNEMUSH_DATA_DIR=/some/path         override data dir (identity, db)
#                                     falls back to ~/.mnemush
#   MNEMUSH_DB_PATH=/some/path/foo.db   overrides db_path above (wins)
#   MNEMUSH_HALF_LIFE_DAYS=30.0         overrides [forgetting].half_life_days
#   MNEMUSH_DISABLE_FORGETTING=true     archive mode (never decay)
#
# The Pi extension additionally honors (set in shell or pi config):
#   MNEMUSH_PRUNE_ON_SESSION_END=apply  (default) — soft-delete up to N
#   MNEMUSH_PRUNE_ON_SESSION_END=dry    list candidates only, no write
#   MNEMUSH_PRUNE_ON_SESSION_END=off    skip the prune pass entirely
#   MNEMUSH_PRUNE_SESSION_LIMIT=5       cap candidates per session

# ── Self-eval log bounds (v0.3) ─────────────────────────────────────────
# The agent plugins write per-session NDJSON to ~/.mnemush/eval/. These
# three caps keep it bounded; applied at session_end in order: TTL,
# per-file line cap, file-count cap.
[eval]
max_age_days = 30          # drop session files older than this (0 = keep all)
max_entries_per_file = 5000 # keep the newest N lines per session file
max_session_files = 30     # keep the N most-recent session files

#   MNEMUSH_EVAL_PRUNE_ON_SESSION_END=off   skip eval-log pruning at session_end

# ── Multi-project isolation (v0.4) ─────────────────────────────────────────
# Default project for writes (and read scope) when isolation is on.
# Empty = no isolation; every memory is global / cross-project.
# Env: MNEMUSH_PROJECT=foo
[project]
default_project = ""

# When true, reads (search, list, memory_next, memory_frontier) ignore
# the default_project filter. Writes are still auto-tagged unless the
# caller overrides. Equivalent to passing --all-projects on every CLI
# read command. Env: MNEMUSH_ALL_PROJECTS=1
cross_project_search = false

# ── Optional semantic search (v1.0) ─────────────────────────────────────────
# When enabled, `mnemush embed` downloads a sentence-transformer model
# (default all-MiniLM-L6-v2 quantized, ~25 MB) and stores per-memory
# embeddings in the `memory_embedding` table. `mnemush search --embed`
# blends cosine similarity with BM25 (final score =
# bm25_weight * bm25 + embed_weight * cosine).
#
# Off by default. First call downloads the model to ~/.mnemush/models/;
# subsequent calls reuse the cached file.
#
# Env: MNEMUSH_EMBEDDINGS_ENABLED=1
[embedding]
enabled = false
model = "sentence-transformers/all-MiniLM-L6-v2-q"
bm25_weight = 0.7
embed_weight = 0.3

# ── Auto-merge (v1.0) ─────────────────────────────────────────────────────
# Near-duplicate snapshot memories (note/skill/insight/episodic) with
# Jaccard similarity >= auto_merge_min_sim are auto-merged: the OLD
# memory is soft-deleted and its edges retargeted to the new one.
# This catches evolving documents (e.g. SKILL.md) that exact-content
# dedup can't. Decision/Correction/Preference use supersede edges
# instead (unchanged).
[edges]
auto_merge_enabled = true
auto_merge_min_sim = 0.6

# ── Capacity management (v1.3) ─────────────────────────────────────────
# DB size cap with eviction, neuropil cold judgment, summary entry
# truncation. Search hits refresh last_accessed_at; cold judgment uses
# it to decide an entry has had no hits for cold_days.
[capacity]
max_db_mb = 100.0           # physical DB cap in MB (checked on add)
cold_days = 30              # neuropil cold: no hits for N days + file unchanged
entry_summary_chars = 300   # summary entries truncate content to N chars
eviction_batch = 100        # eviction processes N entries per batch
