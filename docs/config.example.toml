# Mneme configuration
# Copy to ~/.mneme/config.toml and edit.
# Missing fields = use code defaults (see crates/mneme/src/config.rs).

[forgetting]
# Base half-life in days (importance=0.5 → 90d, importance=1.0 → 135d)
half_life_days = 90.0
# How much importance modulates half-life (0=ignore, 1=±50%)
half_life_importance_weight = 0.5
# confidence below this → prune candidate
prune_confidence_threshold = 0.1
# confidence below this + days no access > prune_max_days_no_access → prune
prune_min_confidence_for_candidate = 0.3
prune_max_days_no_access = 30
# importance above this → exempt from pruning
prune_importance_exempt = 0.7
# access boost factor: confidence *= 1 + ln(access_count+1) * factor
access_boost_factor = 0.15
# initial confidence for new memories
initial_confidence_default = 1.0
# default importance for new memories
importance_default = 0.5
# true = never decay (archive mode)
disable_forgetting = false

[edges]
# auto-link strength for same topic_key
auto_link_topic_strength = 0.6
# text similarity in this range → trigger supersede detection
auto_link_supersede_min_sim = 0.5
auto_link_supersede_max_sim = 0.95
# Weak-similarity auto-link layer (added v0.2). On every memory_add, an
# FTS5 OR-query against recent content computes Jaccard similarity; pairs
# in `[weak_min, weak_max)` get a low-strength `related` edge (up to
# `weak_limit` per new memory). Covers the gap between "same topic" and
# "near-supersede" — surfaces related memories the explicit link missed.
auto_link_weak_min_sim = 0.05
auto_link_weak_max_sim = 0.5
auto_link_weak_strength = 0.4
auto_link_weak_limit = 3
# edge decay half-life (independent of nodes)
edge_decay_half_life_days = 60.0
# default max hops for neighbor queries
max_neighbor_hops = 2
# master switch for auto-linking on add
auto_link_enabled = true

[search]
default_limit = 10
# score = bm25 * relevance^w_r * recency^w_re * importance^w_i
weight_relevance = 1.0
weight_recency = 0.3
weight_importance = 0.2

[storage]
db_path = "~/.mneme/mneme.db"

# ── Environment variable overrides ──────────────────────────────────────
# Applied after TOML is loaded. See apply_env_overrides() in
# crates/mneme/src/config.rs.
#
#   MNEME_DATA_DIR=/some/path         override data dir (identity, db)
#                                     falls back to ~/.mneme
#   MNEME_DB_PATH=/some/path/foo.db   overrides db_path above (wins)
#   MNEME_HALF_LIFE_DAYS=30.0         overrides [forgetting].half_life_days
#   MNEME_DISABLE_FORGETTING=true     archive mode (never decay)
#
# The Pi extension additionally honors (set in shell or pi config):
#   MNEME_PRUNE_ON_SESSION_END=apply  (default) — soft-delete up to N
#   MNEME_PRUNE_ON_SESSION_END=dry    list candidates only, no write
#   MNEME_PRUNE_ON_SESSION_END=off    skip the prune pass entirely
#   MNEME_PRUNE_SESSION_LIMIT=5       cap candidates per session

# ── Self-eval log bounds (v0.3) ─────────────────────────────────────────
# The agent plugins write per-session NDJSON to ~/.mneme/eval/. These
# three caps keep it bounded; applied at session_end in order: TTL,
# per-file line cap, file-count cap.
[eval]
max_age_days = 30          # drop session files older than this (0 = keep all)
max_entries_per_file = 5000 # keep the newest N lines per session file
max_session_files = 30     # keep the N most-recent session files

#   MNEME_EVAL_PRUNE_ON_SESSION_END=off   skip eval-log pruning at session_end
