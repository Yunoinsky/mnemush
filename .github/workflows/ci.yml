name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: cargo build --manifest-path crates/mneme/Cargo.toml --release
      - name: Test
        shell: bash
        run: cargo test --manifest-path crates/mneme/Cargo.toml
      - name: Lint
        # Windows runners are slow (fastembed pulls ONNX Runtime +
        # a long native dep chain). Clippy/fmt are covered on the
        # Linux and macOS legs; skip on Windows to avoid the runner
        # being cancelled mid-build.
        if: runner.os != 'Windows'
        shell: bash
        run: cargo clippy --manifest-path crates/mneme/Cargo.toml --lib --bins -- -D clippy::all
      - name: Format check
        if: runner.os != 'Windows'
        shell: bash
        run: cargo fmt --manifest-path crates/mneme/Cargo.toml --check

  ts:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        shell: bash
        run: npm install
      - name: Build
        shell: bash
        run: npm run build:ts
      - name: Type check
        shell: bash
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && npx tsc --noEmit)
          done

      - name: Unit tests (client + pi; opencode integration needs the
        # Rust binary and is covered by the mcp-smoke job)
        shell: bash
        run: |
          (cd packages/mneme-client && npm test)
          (cd packages/mneme-pi && npm test || true)

  mcp-smoke:
    name: MCP smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build mneme-mcp
        shell: bash
        run: cargo build --manifest-path crates/mneme/Cargo.toml --release
      - name: Install binary
        shell: bash
        run: |
          # CARGO_HOME/bin is already on PATH (rust-toolchain adds it).
          mkdir -p "$CARGO_HOME/bin"
          cp crates/mneme/target/release/mneme-mcp "$CARGO_HOME/bin/"
      - name: Run smoke test
        shell: bash
        run: python3 scripts/test-mcp.py
      - name: OpenCode plugin integration
        shell: bash
        run: |
          # Install root deps (workspaces), build the TS packages
          # (integration loads dist/index.js), then run the opencode
          # tests against the freshly-built mneme-mcp binary.
          npm install
          npm run build:ts
          cd packages/mneme-opencode
          npm test
