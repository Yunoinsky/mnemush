name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --manifest-path crates/mneme/Cargo.toml --release
      - name: Test
        run: cargo test --manifest-path crates/mneme/Cargo.toml
      - name: Lint
        run: cargo clippy --manifest-path crates/mneme/Cargo.toml --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --manifest-path crates/mneme/Cargo.toml --check

  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && npx tsc --noEmit)
          done

      - name: Unit tests
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && npm test)
          done

  mcp-smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build mneme-mcp
        run: cargo build --manifest-path crates/mneme/Cargo.toml --release
      - name: Install binary
        run: cp crates/mneme/target/release/mneme-mcp /usr/local/bin/
      - name: Run smoke test
        run: python3 scripts/test-mcp.py
